<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví Điện Tử Thông Minh</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-weight/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col justify-between">

    <header class="text-center py-10 bg-white shadow-sm border-b border-slate-100">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 text-white text-2xl shadow-lg shadow-blue-200 mb-4">
            <i class="fa-solid fa-wallet"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-800">Ví Điện Tử Thông Minh</h1>
        <p class="text-slate-500 mt-2 font-medium">Quản lý tài chính cá nhân theo phong cách chuyên nghiệp</p>
    </header>

    <main id="mainContainer" class="max-w-5xl w-full mx-auto px-4 py-12 flex-grow flex items-center justify-center">
        <div class="grid md:grid-cols-2 gap-8 w-full">
            
            <div class="bg-white p-8 rounded-3xl shadow-md border border-slate-100 transition-all hover:shadow-lg">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg font-bold">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800">Tạo Tài Khoản</h2>
                </div>
                
                <form class="space-y-4" onsubmit="handleRegister(event)">
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1.5">Họ và Tên</label>
                        <input type="text" id="regFullname" placeholder="Ví dụ: Nguyễn Văn An" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all bg-slate-50/50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1.5">Tài khoản</label>
                        <input type="text" id="regUsername" placeholder="Nhập tên tài khoản" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all bg-slate-50/50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1.5">Mật khẩu</label>
                        <input type="password" id="regPassword" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all bg-slate-50/50">
                    </div>
                    <button type="submit" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-check"></i> Đăng Ký Tài Khoản
                    </button>
                </form>
            </div>

            <div class="bg-white p-8 rounded-3xl shadow-md border border-slate-100 transition-all hover:shadow-lg">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg font-bold">
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800">Đăng Nhập Máy Chủ</h2>
                </div>
                
                <form class="space-y-4" onsubmit="handleLogin(event)">
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1.5">Tài khoản</label>
                        <input type="text" id="loginUsername" placeholder="Nhập tài khoản" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all bg-slate-50/50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1.5">Mật khẩu</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all bg-slate-50/50">
                    </div>
                    <button type="submit" class="w-full mt-8 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-server"></i> Kết Nối Hệ Thống
                    </button>
                </form>
            </div>

        </div>
    </main>

    <footer class="text-center py-6 text-sm text-slate-400 font-medium">
        &copy; 2026 Fintech Workshop. Đồng bộ dữ liệu Full-Stack trực tuyến.
    </footer>

    <script>
        const API_URL = 'https://fintech-backend-api-t83c.onrender.com/api';

        // 1. XỬ LÝ ĐĂNG KÝ
        async function handleRegister(event) {
            if (event) event.preventDefault(); 
            
            const fullname = document.getElementById('regFullname').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (fullname === "" || username === "" || password === "") {
                alert("⚠️ Vui lòng điền đầy đủ tất cả thông tin đăng ký!");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, fullname })
                });
                const data = await response.json();
                alert(data.message);
            } catch (error) {
                alert("❌ Lỗi kết nối đám mây: " + error.message);
            }
        }

        // 2. XỬ LÝ ĐĂNG NHẬP
        async function handleLogin(event) {
            if (event) event.preventDefault(); 
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (username === "" || password === "") {
                alert("⚠️ Vui lòng nhập tài khoản và mật khẩu để đăng nhập!");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                
                if (data.success) {
                    alert("🎉 Đăng nhập thành công! Hệ thống đám mây đã thông suốt.");
                    
                    // Lấy tên hiển thị từ dữ liệu server trả về hoặc dùng tạm username
                    const displayUser = data.fullname || username; 
                    
                    // THỰC HIỆN BIẾN ĐỔI GIAO DIỆN - THẾ CHỖ MÀN HÌNH ĐĂNG NHẬP THÀNH DASHBOARD
                    document.getElementById('mainContainer').innerHTML = `
                        <div class="max-w-md w-full mx-auto bg-white p-8 rounded-3xl shadow-xl border border-slate-100 text-center transition-all">
                            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 shadow-inner">
                                <i class="fa-solid fa-circle-user"></i>
                            </div>
                            <h2 class="text-2xl font-extrabold text-slate-800">Xin chào, ${displayUser}!</h2>
                            <p class="text-slate-400 text-sm mt-1 font-medium">Chào mừng bạn đã truy cập Hệ Thống Thành Viên</p>
                            
                            <div class="mt-6 p-5 bg-gradient-to-br from-slate-900 to-slate-800 rounded-2xl text-left shadow-lg">
                                <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Số dư tài khoản ví</div>
                                <div class="text-3xl font-black text-white mt-1">5,000,000 đ</div>
                                <div class="text-xs text-emerald-400 mt-2 flex items-center gap-1 font-medium">
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Cloud API Connected
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-3 mt-4">
                                <button onclick="alert('Tính năng nạp tiền trực tuyến đang được nâng cấp!')" class="p-3 bg-slate-50 border border-slate-100 hover:bg-slate-100 font-bold text-slate-700 rounded-xl text-sm transition-all cursor-pointer flex items-center justify-center gap-1.5">
                                    <i class="fa-solid fa-circle-arrow-down text-blue-500"></i> Nạp tiền
                                </button>
                                <button onclick="alert('Tính năng chuyển khoản đang được nâng cấp!')" class="p-3 bg-slate-50 border border-slate-100 hover:bg-slate-100 font-bold text-slate-700 rounded-xl text-sm transition-all cursor-pointer flex items-center justify-center gap-1.5">
                                    <i class="fa-solid fa-circle-arrow-up text-emerald-500"></i> Chuyển tiền
                                </button>
                            </div>

                            <button onclick="location.reload()" class="mt-8 text-sm font-bold text-slate-400 hover:text-red-500 transition-all cursor-pointer flex items-center justify-center gap-1.5 mx-auto">
                                <i class="fa-solid fa-power-off"></i> Đăng xuất ứng dụng
                            </button>
                        </div>
                    `;

                } else {
                    alert("❌ " + data.message);
                }
            } catch (error) {
                alert("❌ Lỗi kết nối đám mây: " + error.message);
            }
        }
    </script>
</body>
</html>
