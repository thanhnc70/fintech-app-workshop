<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví Điện Tử Thông Minh Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <header id="mainHeader" class="text-center py-8 bg-white shadow-sm border-b border-slate-200">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white text-xl shadow-md shadow-blue-200 mb-3">
            <i class="fa-solid fa-wallet"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-800 tracking-tight">VÍ ĐIỆN TỬ THÔNG MINH</h1>
        <p class="text-slate-400 text-xs mt-1 font-medium uppercase tracking-wider">Hệ thống quản lý tài chính đám mây</p>
    </header>

    <main id="mainContainer" class="max-w-6xl w-full mx-auto px-4 py-8 flex-grow flex items-center justify-center">
        <!-- VÙNG 1: GIAO DIỆN ĐĂNG NHẬP / ĐĂNG KÝ (Mặc định hiển thị nếu chưa login) -->
        <div id="authSection" class="grid md:grid-cols-2 gap-8 w-full max-w-4xl">
            
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200/60 transition-all hover:shadow-md">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-md font-bold">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-800">Tạo Tài Khoản Mới</h2>
                </div>
                
                <form class="space-y-4" onsubmit="handleRegister(event)">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Họ và Tên</label>
                        <input type="text" id="regFullname" placeholder="Nguyễn Văn An" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all bg-slate-50/50 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tài khoản đăng nhập</label>
                        <input type="text" id="regUsername" placeholder="username123" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all bg-slate-50/50 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Mật khẩu bảo mật</label>
                        <input type="password" id="regPassword" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all bg-slate-50/50 text-sm">
                    </div>
                    <button type="submit" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-500/10 transition-all flex items-center justify-center gap-2 cursor-pointer text-sm">
                        <i class="fa-solid fa-check"></i> Đăng Ký Ngay
                    </button>
                </form>
            </div>

            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200/60 transition-all hover:shadow-md">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-md font-bold">
                        <i class="fa-solid pointer-events-none fa-right-to-bracket"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-800">Đăng Nhập Hệ Thống</h2>
                </div>
                
                <form class="space-y-4" onsubmit="handleLogin(event)">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tài khoản</label>
                        <input type="text" id="loginUsername" placeholder="Nhập tên tài khoản" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all bg-slate-50/50 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Mật khẩu</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all bg-slate-50/50 text-sm">
                    </div>
                    <button type="submit" class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-emerald-500/10 transition-all flex items-center justify-center gap-2 cursor-pointer text-sm">
                        <i class="fa-solid fa-server"></i> Kết Nối Máy Chủ
                    </button>
                </form>
            </div>
        </div>

        <!-- VÙNG 2: GIAO DIỆN QUẢN LÝ TÀI CHÍNH (Ẩn mặc định, chỉ hiện khi đã Đăng nhập) -->
        <div id="dashboardSection" class="hidden w-full max-w-5xl space-y-6">
            <!-- Thẻ thông tin người dùng và nút đăng xuất -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-6 rounded-2xl border border-slate-200/60 gap-4">
                <div>
                    <h3 class="text-lg font-bold text-slate-800" id="welcomeUser">Xin chào, Người dùng!</h3>
                    <p class="text-xs font-bold text-slate-400 uppercase mt-0.5" id="user-id">ID: --</p>
                </div>
                <button onclick="handleLogout()" class="px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold uppercase tracking-wider rounded-xl transition-all cursor-pointer">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất
                </button>
            </div>

            <div class="grid md:grid-cols-3 gap-6">
                <!-- Cột trái: Form nhập giao dịch -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200/60 space-y-4 h-fit">
                    <h3 class="text-md font-bold text-slate-800 border-b border-slate-100 pb-3">
                        <i class="fa-solid fa-plus-minus text-blue-500 mr-1"></i> Lưu Giao Dịch
                    </h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Nội dung</label>
                            <input type="text" id="title" placeholder="Ví dụ: Tiền lương, Mua sắm..." class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-blue-500 bg-slate-50/50">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Số tiền (VNĐ)</label>
                            <input type="number" id="amount" placeholder="Nhập số tiền" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-blue-500 bg-slate-50/50">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Loại giao dịch</label>
                            <select id="type" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-blue-500 bg-slate-50/50">
                                <option value="income">Thu nhập (+)</option>
                                <option value="expense">Chi tiêu (-)</option>
                            </select>
                        </div>
                        <button onclick="saveTransaction()" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition-all text-xs uppercase tracking-wider cursor-pointer">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Ghi dữ liệu
                        </button>
                    </div>
                </div>

                <!-- Cột phải: Thống kê số dư và Danh sách giao dịch -->
                <div class="md:col-span-2 space-y-6">
                    <!-- Khối Tổng số dư -->
                    <div class="bg-gradient-to-r from-slate-900 to-indigo-950 p-6 rounded-2xl text-white shadow-inner flex justify-between items-center">
                        <div>
                            <p class="text-xs font-bold tracking-widest text-indigo-200 uppercase">Tổng số dư hiện tại</p>
                            <h2 class="text-3xl font-black mt-1 tracking-tight text-emerald-400" id="totalBalance">0 đ</h2>
                        </div>
                        <div class="text-3xl text-indigo-400 opacity-60">
                            <i class="fa-solid fa-chart-line"></i>
                        </div>
                    </div>

                    <!-- Khối Lịch sử giao dịch -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200/60">
                        <h3 class="text-md font-bold text-slate-800 border-b border-slate-100 pb-3 mb-3">
                            <i class="fa-solid fa-list-ul text-emerald-500 mr-1"></i> Nhật ký hoạt động tài chính
                        </h3>
                        <div class="overflow-y-auto max-h-72 space-y-2 pr-1" id="transactionList">
                            <!-- Danh sách được Render tự động tại đây -->
                            <p class="text-sm text-slate-400 text-center py-6">Chưa có bản ghi dữ liệu nào.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-slate-400 font-medium border-t border-slate-200 bg-white mt-8">
        &copy; 2026 Fintech Workshop Premium. Đồng bộ hóa dữ liệu thời gian thực.
    </footer>
            <script>
        const API_URL = 'https://fintech-backend-api-t83c.onrender.com';

        // 1. KIỂM TRA TRẠNG THÁI ĐĂNG NHẬP KHI TẢI TRANG
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthStatus();
        });

        function checkAuthStatus() {
            let user = JSON.parse(localStorage.getItem('user'));
            const authSection = document.getElementById('authSection');
            const dashboardSection = document.getElementById('dashboardSection');

            // Xử lý phòng ngừa nếu Backend trả về dạng Mảng [ {} ] thay vì Đối tượng { }
            if (Array.isArray(user) && user.length > 0) {
                user = user[0];
                localStorage.setItem('user', JSON.stringify(user)); // Đồng bộ lại cấu trúc chuẩn
            }

            if (user && user.id) {
                // Đã đăng nhập: Hiện Dashboard, ẩn Form đăng nhập
                authSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                
                document.getElementById('welcomeUser').innerText = `Xin chào, ${user.fullname || user.username}!`;
                document.getElementById('user-id').innerText = `ID: ${user.id}`;
                
                // Lấy danh sách giao dịch
                fetchTransactions(user.id);
            } else {
                // Chưa đăng nhập hoặc lỗi cấu trúc: Hiện Form đăng nhập
                authSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
            }
        }

        // 2. CHỨC NĂNG ĐĂNG KÝ
        async function handleRegister(event) {
            if (event) event.preventDefault();
            const fullname = document.getElementById('regFullname').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!fullname || !username || !password) {
                alert("⚠️ Vui lòng điền đầy đủ tất cả thông tin!");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, fullname })
                });
                const data = await response.json();
                alert(data.message);
                if (data.success) {
                    document.getElementById('regFullname').value = '';
                    document.getElementById('regUsername').value = '';
                    document.getElementById('regPassword').value = '';
                }
            } catch (error) {
                alert("❌ Lỗi kết nối đám mây: " + error.message);
            }
        }

        // 3. CHỨC NĂNG ĐĂNG NHẬP (Bổ sung bóc tách mảng tự động)
        async function handleLogin(event) {
            if (event) event.preventDefault();
            
            const usernameInput = document.getElementById('loginUsername');
            const passwordInput = document.getElementById('loginPassword');
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                alert("⚠️ Vui lòng nhập đầy đủ tài khoản & mật khẩu!");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    let userData = data.user;
                    // Nếu Backend trả về mảng, lấy phần tử đầu tiên
                    if (Array.isArray(userData)) {
                        userData = userData[0];
                    }
                    
                    if (userData && userData.id) {
                        localStorage.setItem('user', JSON.stringify(userData));
                        window.location.reload(); 
                    } else {
                        alert("❌ Dữ liệu người dùng trả về từ Server không hợp lệ!");
                    }
                } else {
                    alert("❌ " + (data.message || "Sai tài khoản hoặc mật khẩu!"));
                }
            } catch (error) {
                alert("❌ Lỗi kết nối máy chủ: " + error.message);
            }
        }

        // 4. ĐĂNG XUẤT TÀI KHOẢN
        function handleLogout() {
            localStorage.removeItem('user');
            window.location.reload();
        }

        // 5. LẤY DANH SÁCH GIAO DỊCH TỪ BACKEND
        async function fetchTransactions(userId) {
            try {
                const response = await fetch(`${API_URL}/transactions?userId=${userId}`);
                if (!response.ok) throw new Error("Không thể tải danh sách dữ liệu");
                
                const list = await response.json();
                renderTransactions(list);
            } catch (error) {
                console.error("Lỗi lấy nhật ký giao dịch:", error);
            }
        }

        // 6. HIỂN THỊ DỮ LIỆU LÊN GIAO DIỆN VÀ TÍNH SỐ DƯ
        function renderTransactions(list) {
            const container = document.getElementById('transactionList');
            const totalBalanceEl = document.getElementById('totalBalance');
            
            if (!list || !Array.isArray(list) || list.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-400 text-center py-6">Chưa có dữ liệu giao dịch nào.</p>`;
                totalBalanceEl.innerText = "0 đ";
                return;
            }

            let html = '';
            let total = 0;

            list.forEach(item => {
                const amount = parseFloat(item.amount || 0);
                const isIncome = item.type === 'income' || amount >= 0;
                
                if (isIncome) {
                    total += Math.abs(amount);
                } else {
                    total -= Math.abs(amount);
                }

                const badgeClass = isIncome ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600';
                const icon = isIncome ? 'fa-circle-arrow-down' : 'fa-circle-arrow-up';
                const sign = isIncome ? '+' : '-';

                html += `
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100 text-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold ${badgeClass}">
                                <i class="fa-solid ${icon}"></i>
                            </div>
                            <div>
                                <p class="font-bold text-slate-700">${item.title || 'Không có tiêu đề'}</p>
                                <p class="text-[10px] text-slate-400 font-medium">${item.createdat ? new Date(item.createdat).toLocaleString('vi-VN') : 'Vừa xong'}</p>
                            </div>
                        </div>
                        <span class="font-black ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
                            ${sign}${Math.abs(amount).toLocaleString('vi-VN')} đ
                        </span>
                    </div>
                `;
            });

            container.innerHTML = html;
            totalBalanceEl.innerText = `${total.toLocaleString('vi-VN')} đ`;
            
            if(total < 0) {
                totalBalanceEl.className = "text-3xl font-black mt-1 tracking-tight text-rose-400";
            } else {
                totalBalanceEl.className = "text-3xl font-black mt-1 tracking-tight text-emerald-400";
            }
        }

        // 7. LƯU GIAO DỊCH MỚI
        async function saveTransaction() {
            let user = JSON.parse(localStorage.getItem('user'));
            if (Array.isArray(user)) user = user[0];

            if (!user || !user.id) {
                alert("⚠️ Vui lòng đăng nhập trước khi thực hiện giao dịch!");
                return;
            }

            const titleInput = document.getElementById('title');
            const amountInput = document.getElementById('amount');
            const typeInput = document.getElementById('type');

            const title = titleInput.value.trim();
            const amount = amountInput.value.trim();
            const type = typeInput.value;

            if (!title || !amount) {
                alert("⚠️ Vui lòng nhập đầy đủ nội dung và số tiền!");
                return;
            }

            const transactionData = {
                userId: user.id, 
                title: title,
                amount: parseFloat(amount),
                type: type
            };

            try {
                const response = await fetch(`${API_URL}/transactions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(transactionData)
                });
                
                const data = await response.json();
                if (data.success) {
                    titleInput.value = '';
                    amountInput.value = '';
                    fetchTransactions(user.id);
                } else {
                    alert("❌ Lỗi: " + data.message);
                }
            } catch (error) {
                alert("❌ Lỗi kết nối đám mây: " + error.message);
            }
        }
    </script>
</body>
</html>
