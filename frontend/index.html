<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví Điện Tử Thông Minh Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <header id="mainHeader" class="text-center py-8 bg-white shadow-sm border-b border-slate-200">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white text-xl shadow-md shadow-blue-200 mb-3">
            <i class="fa-solid fa-wallet"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-800 tracking-tight">VÍ ĐIỆN TỬ THÔNG MINH</h1>
        <p class="text-slate-400 text-xs mt-1 font-medium uppercase tracking-wider">Hệ thống quản lý tài chính đám mây</p>
    </header>

    <main id="mainContainer" class="max-w-6xl w-full mx-auto px-4 py-8 flex-grow flex items-center justify-center">
        <div class="grid md:grid-cols-2 gap-8 w-full max-w-4xl">
            
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200/60 transition-all hover:shadow-md">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-md font-bold">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-800">Tạo Tài Khoản Mới</h2>
                </div>
                
                <form class="space-y-4" onsubmit="handleRegister(event)">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Họ và Tên</label>
                        <input type="text" id="regFullname" placeholder="Nguyễn Văn An" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all bg-slate-50/50 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tài khoản đăng nhập</label>
                        <input type="text" id="regUsername" placeholder="username123" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all bg-slate-50/50 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Mật khẩu bảo mật</label>
                        <input type="password" id="regPassword" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all bg-slate-50/50 text-sm">
                    </div>
                    <button type="submit" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-500/10 transition-all flex items-center justify-center gap-2 cursor-pointer text-sm">
                        <i class="fa-solid fa-check"></i> Đăng Ký Ngay
                    </button>
                </form>
            </div>

            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200/60 transition-all hover:shadow-md">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-md font-bold">
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-800">Đăng Nhập Hệ Thống</h2>
                </div>
                
                <form class="space-y-4" onsubmit="handleLogin(event)">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tài khoản</label>
                        <input type="text" id="loginUsername" placeholder="Nhập tên tài khoản" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all bg-slate-50/50 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Mật khẩu</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all bg-slate-50/50 text-sm">
                    </div>
                    <button type="submit" class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-emerald-500/10 transition-all flex items-center justify-center gap-2 cursor-pointer text-sm">
                        <i class="fa-solid fa-server"></i> Kết Nối Máy Chủ
                    </button>
                </form>
            </div>

        </div>
    </main>

    <footer class="text-center py-4 text-xs text-slate-400 font-medium border-t border-slate-200 bg-white">
        &copy; 2026 Fintech Workshop Premium. Đồng bộ hóa dữ liệu thời gian thực.
    </footer>

    <script>
        const API_URL = 'https://fintech-backend-api-t83c.onrender.com/api';
        let transactions = [];
        let currentUserId = null;

        // 1. CHỨC NĂNG ĐĂNG KÝ
        async function handleRegister(event) {
            if (event) event.preventDefault();
            const fullname = document.getElementById('regFullname').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!fullname || !username || !password) {
                alert("⚠️ Vui lòng điền đầy đủ tất cả thông tin!");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, fullname })
                });
                const data = await response.json();
                alert(data.message);
            } catch (error) {
                alert("❌ Lỗi kết nối đám mây: " + error.message);
            }
        }

        // 2. CHỨC NĂNG ĐĂNG NHẬP (ĐÃ CẬP NHẬT BẮT LỖI TUYỆT ĐỐI)
async function handleLogin(event) {
    if (event) event.preventDefault();
    
    const usernameInput = document.getElementById('loginUsername');
    const passwordInput = document.getElementById('loginPassword');
    
    if (!usernameInput || !passwordInput) {
        alert("❌ Lỗi hệ thống: Không tìm thấy các ô nhập liệu HTML!");
        return;
    }

    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();

    if (!username || !password) {
        alert("⚠️ Vui lòng nhập đầy đủ tài khoản & mật khẩu!");
        return;
    }

    try {
        console.log("Đang gửi yêu cầu đăng nhập tới:", `${API_URL}/login`);
        
        const response = await fetch(`${API_URL}/login`, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({ username, password })
        });

        // Kiểm tra xem phản hồi từ server có phản hồi lỗi HTTP (401, 500, v.v.) không
        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            alert(`❌ Máy chủ từ chối (Mã lỗi ${response.status}): ${errorData.message || 'Sai tài khoản hoặc mật khẩu!'}`);
            return;
        }

        const data = await response.json();
        
        if (data.success) {
            alert("🎉 Kết nối ví thành công! Đang tải dữ liệu từ Neon Database...");
            const displayUser = data.fullname || username;
            currentUserId = data.userId || data.id; 
            
            // Ẩn Header cũ, định hình lại không gian hiển thị Dashboard
            document.getElementById('mainHeader').classList.add('hidden');
            const container = document.getElementById('mainContainer');
            container.className = "w-full mx-auto px-4 py-6 flex-grow max-w-6xl";
            
            // Gọi hàm sinh giao diện Dashboard
            renderDashboard(displayUser);
            
            // Đồng bộ dữ liệu thực tế từ Neon SQL về bảng
            fetchTransactions();
        } else {
            alert("❌ Đăng nhập thất bại: " + data.message);
        }
    } catch (error) {
        // KHẮC PHỤC TRIỆT ĐỂ: Hiện thẳng lỗi kết nối lên màn hình thay vì đứng im
        console.error("Chi tiết lỗi kết nối máy chủ:", error);
        alert(`🚨 KHÔNG THỂ KẾT NỐI MÁY CHỦ!\n\nLý do: Tên miền Render đang khởi động (mất 1-2 phút) hoặc bị trình duyệt chặn giao thức.\nChi tiết: ${error.message}`);
    }
}

        // 3. HÀM SINH CẤU TRÚC GIAO DIỆN DASHBOARD
        function renderDashboard(user) {
            document.getElementById('mainContainer').innerHTML = `
                <div class="grid lg:grid-cols-3 gap-6 items-start w-full">
                    
                    <div class="space-y-6 lg:col-span-1">
                        <div class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden border border-indigo-500/10">
                            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-2xl"></div>
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2.5">
                                    <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-sm"><i class="fa-solid fa-crown text-amber-400"></i></div>
                                    <span class="text-sm font-medium text-slate-300">${user}</span>
                                </div>
                                <span class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold px-2 py-0.5 rounded-full tracking-wider uppercase">Live Neon</span>
                            </div>
                            <div class="mt-8">
                                <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Số dư khả dụng</span>
                                <div id="balanceDisplay" class="text-3xl font-black tracking-tight mt-0.5">0 đ</div>
                            </div>
                            <div class="mt-6 pt-4 border-t border-white/10 flex justify-between text-xs text-slate-400">
                                <span>Thành viên: Bạch Kim</span>
                                <span>ID: #${currentUserId}</span>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60">
                            <h3 id="formActionTitle" class="text-md font-bold text-slate-800 flex items-center gap-2 mb-4">
                                <i class="fa-solid fa-square-plus text-blue-500"></i> Ghi Chép Thu Chi Mới
                            </h3>
                            <input type="hidden" id="txId">
                            <div class="space-y-3.5">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Tên mục giao dịch</label>
                                    <input type="text" id="txTitle" placeholder="Ví dụ: Tiền chợ, Mua sắm..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-sm bg-slate-50/50">
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Số tiền (đ)</label>
                                        <input type="number" id="txAmount" placeholder="50000" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-sm bg-slate-50/50">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Phân loại</label>
                                        <select id="txType" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-sm bg-slate-50/50">
                                            <option value="expense">📉 Khoản Chi Out</option>
                                            <option value="income">📈 Khoản Thu In</option>
                                        </select>
                                    </div>
                                </div>
                                <button type="button" onclick="saveTransaction()" class="w-full mt-2 bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-4 rounded-xl shadow-md shadow-slate-800/10 transition-all flex items-center justify-center gap-1.5 cursor-pointer text-xs">
                                    <i class="fa-solid fa-floppy-disk"></i> Lưu Giao Dịch
                                </button>
                                <button id="cancelEditBtn" type="button" onclick="resetForm()" class="w-full text-center text-[11px] text-slate-400 font-bold hover:text-slate-600 hidden mt-2">
                                    Hủy bỏ chế độ chỉnh sửa
                                </button>
                            </div>
                        </div>

                        <button onclick="location.reload()" class="w-full py-2.5 text-center text-xs text-slate-400 font-bold hover:text-red-500 border border-dashed border-slate-300 rounded-xl transition-all cursor-pointer">
                            <i class="fa-solid fa-power-off"></i> Đăng xuất tài khoản an toàn
                        </button>
                    </div>

                    <div class="lg:col-span-2 space-y-4 w-full">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-200/60 overflow-hidden">
                            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/60">
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid fa-list-check text-indigo-500"></i>
                                    <h3 class="text-sm font-bold text-slate-800">Sổ Nhật Ký Quản Lý Thu Chi (Neon Cloud)</h3>
                                </div>
                                <span class="text-[11px] font-bold text-slate-400 bg-white border border-slate-200 px-2.5 py-1 rounded-lg">Tổng: <span id="txCount" class="text-indigo-600">0</span> bản ghi</span>
                            </div>

                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="border-b border-slate-100 text-[11px] font-bold text-slate-400 uppercase tracking-wider bg-slate-50/30">
                                            <th class="py-3 px-6">Mục nội dung</th>
                                            <th class="py-3 px-6">Phân loại</th>
                                            <th class="py-3 px-4 text-right">Số tiền</th>
                                            <th class="py-3 px-6 text-center">Hành động chỉnh sửa</th>
                                        </tr>
                                    </thead>
                                    <tbody id="transactionList" class="divide-y divide-slate-100 text-sm"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            `;
        }

        // 4. HÀM READ - LẤY DỮ LIỆU TỪ NEON DATABASE (Đã đồng bộ query params với backend mới)
        async function fetchTransactions() {
            try {
                const response = await fetch(`${API_URL}/transactions?userId=${currentUserId}`);
                const data = await response.json();
                transactions = data.transactions || [];
                renderTransactionTable();
            } catch (error) {
                console.error("Lỗi tải danh sách giao dịch:", error);
            }
        }

        // 5. RENDER BẢNG VÀ TÍNH SỐ DƯ THỰC TẾ (Sử dụng chuẩn thuộc tính chữ thường)
        function renderTransactionTable() {
            const listContainer = document.getElementById('transactionList');
            if (!listContainer) return;

            listContainer.innerHTML = '';
            let totalBalance = 0;

            if (transactions.length === 0) {
                listContainer.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-slate-400 font-medium">Chưa có giao dịch nào được ghi chép. Hãy thêm giao dịch mới!</td></tr>`;
                document.getElementById('balanceDisplay').innerText = "0 đ";
                document.getElementById('txCount').innerText = "0";
                return;
            }

            transactions.forEach(tx => {
                const amountNum = parseFloat(tx.amount);
                const is
