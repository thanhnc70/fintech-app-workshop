<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví Điện Tử Thông Minh - Fintech App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .auth-card { max-width: 450px; margin: 80px auto; border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .app-sidebar { background: linear-gradient(180deg, #1e1e2f 0%, #11111d 100%); color: #fff; min-height: 100vh; border-radius: 0 20px 20px 0; }
        .balance-card { background: linear-gradient(135deg, #2e2e4f 0%, #1a1a2e 100%); color: #fff; border: none; border-radius: 20px; padding: 25px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .main-content { padding: 40px; }
        .table-card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); background-color: #fff; }
    </style>
</head>
<body>

    <div id="authSection" class="container" style="display: block;">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card auth-card p-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary">VÍ ĐIỆN TỬ THÔNG MINH</h3>
                        <p class="text-muted small">Hệ thống quản lý tài chính đám mây</p>
                    </div>
                    <h5 class="fw-bold mb-3">➡️ Đăng Nhập Hệ Thống</h5>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">TÀI KHOẢN</label>
                            <input type="text" id="loginUsername" class="form-control" placeholder="Nhập tên tài khoản" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted">MẬT KHẨU</label>
                            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold py-2">💻 Kết Nối Máy Chủ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="mainSection" class="container-fluid" style="display: none;">
        <div class="row">
            <div class="col-md-3 col-lg-2 app-sidebar p-4 d-flex flex-column justify-content-between">
                <div>
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-warning rounded-circle p-2 me-3 text-dark fw-bold">👑</div>
                        <div>
                            <h6 class="mb-0 fw-bold" id="userNameDisplay">Đang tải...</h6>
                            <span class="badge bg-success small">LIVE NEON</span>
                        </div>
                    </div>
                    <div class="card balance-card mb-4">
                        <span class="small text-uppercase opacity-70">Số dư khả dụng</span>
                        <h2 class="fw-bold my-2" id="availableBalance">0 đ</h2>
                        <div class="d-flex justify-content-between pt-2 border-top border-secondary mt-2 small opacity-70">
                            <span>Thành viên: Bạch Kim</span>
                            <span id="userIdDisplay">ID: #---</span>
                        </div>
                    </div>
                </div>
                <button onclick="handleLogout()" class="btn btn-outline-danger w-100 btn-sm">🛑 Đăng xuất tài khoản an toàn</button>
            </div>

            <div class="col-md-9 col-lg-10 main-content">
                <div class="row g-4">
                    <div class="col-lg-4">
                        <div class="card table-card p-4">
                            <h5 class="fw-bold text-dark mb-4">➕ Ghi Chép Thu Chi Mới</h5>
                            <form id="transactionForm">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-muted">TÊN MỤC GIAO DỊCH</label>
                                    <input type="text" id="txTitle" class="form-control" placeholder="Ví dụ: Tiền chợ, Mua sắm..." required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-muted">SỐ TIỀN (Đ)</label>
                                    <input type="number" id="txAmount" class="form-control" placeholder="50000" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label small fw-bold text-muted">PHÂN LOẠI</label>
                                    <select id="txType" class="form-select">
                                        <option value="income">📈 Khoản Thu In (Cộng tiền)</option>
                                        <option value="expense">📉 Khoản Chi Out (Trừ tiền)</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-dark w-100 fw-bold py-2">💾 Lưu Giao Dịch</button>
                            </form>
                        </div>
                    </div>

                    <div class="col-lg-8">
                        <div class="card table-card p-4">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h5 class="fw-bold text-dark mb-0">📜 Sổ Nhật Ký Quản Lý Thu Chi (Neon Cloud)</h5>
                                <span class="badge bg-secondary p-2" id="totalRecords">Tổng: 0 bản ghi</span>
                            </div>
                            <div class="table-responsive">
                                <table class="table align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th class="px-4 py-3">MỤC NỘI DUNG</th>
                                            <th class="px-4 py-3">PHÂN LOẠI</th>
                                            <th class="px-4 py-3">SỐ TIỀN</th>
                                            <th class="px-4 py-3">HÀNH ĐỘNG CHÍNH SỬA</th>
                                        </tr>
                                    </thead>
                                    <tbody id="transactionList">
                                        </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. CẤU HÌNH ĐƯỜNG DẪN API SANG SERVER RENDER CHUẨN CỦA BẠN (Thêm đuôi /api)
        const API_URL = 'https://fintech-backend-api-t83c.onrender.com/api'; 

        // Biến lưu trạng thái phiên đăng nhập của người dùng toàn cục
        let currentUser = null;

        // 2. TỰ ĐỘNG CHẠY KHI TẢI TRANG WEB
        document.addEventListener("DOMContentLoaded", () => {
            const savedUser = localStorage.getItem('user');
            
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    // Đồng bộ trường id linh hoạt phòng tránh lỗi bất đồng cấu trúc dữ liệu
                    if (currentUser && (currentUser.id || currentUser.userId)) {
                        currentUser.id = currentUser.id || currentUser.userId;
                        showMainApp();
                        loadTransactions();
                    } else {
                        showAuthForm();
                    }
                } catch (e) {
                    console.error("Lỗi parse cấu trúc user LocalStorage:", e);
                    showAuthForm();
                }
            } else {
                showAuthForm();
            }
            
            // Gắn sự kiện gửi dữ liệu cho 2 Form Login và Thêm giao dịch
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('transactionForm').addEventListener('submit', handleAddTransaction);
        });

        // Hàm hiển thị khu vực màn hình làm việc chính
        function showMainApp() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('mainSection').style.display = 'block';
            
            // Đổ tên và mã số ID người dùng ra màn hình UI
            document.getElementById('userNameDisplay').innerText = currentUser.fullname || currentUser.username || 'Thành viên';
            document.getElementById('userIdDisplay').innerText = `ID: #${currentUser.id}`; // Không bao giờ lỗi #undefined nữa
        }

        // Hàm đưa người dùng về trạng thái màn hình đăng nhập
        function showAuthForm() {
            localStorage.removeItem('user');
            document.getElementById('authSection').style.style.display = 'block';
            document.getElementById('mainSection').style.display = 'none';
        }

        // 3. LOGIC XỬ LÝ ĐĂNG NHẬP (Chống triệt để việc mất trường ID)
        async function handleLogin(event) {
            if (event) event.preventDefault();
            
            const usernameInput = document.getElementById('loginUsername');
            const passwordInput = document.getElementById('loginPassword');
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                alert("⚠️ Vui lòng điền thông tin Tài khoản & Mật khẩu!");
                return;
            }

            try {
                // Fetch trực tiếp sang API trên Render
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Mã nguồn phản hồi không đúng định dạng JSON (Khả năng máy chủ backend của bạn đang sleep hoặc lỗi đường dẫn).");
                }

                const data = await response.json();

                if (data.success) {
                    let userData = data.user;
                    
                    if (Array.isArray(userData)) {
                        userData = userData[0]; // Ép lấy phần tử đầu nếu backend trả về mảng dữ liệu
                    }
                    
                    // Giải pháp an toàn tối đa: Quét và giữ lại thuộc tính ID không để rỗng
                    const checkedId = userData.id || userData.userId;

                    if (userData && checkedId) {
                        currentUser = {
                            id: Number(checkedId), // Lưu dạng số nguyên (Ví dụ: 1 cho tài khoản 'an')
                            username: userData.username,
                            fullname: userData.fullname || userData.fullname
                        };

                        localStorage.setItem('user', JSON.stringify(currentUser));
                        alert("🎉 Đăng nhập ví điện tử thành công!");
                        window.location.reload(); 
                    } else {
                        alert("❌ Cấu trúc gói tin từ server bị thiếu trường định danh ID!");
                    }
                } else {
                    alert("❌ Đăng nhập thất bại: " + (data.message || "Tài khoản hoặc mật khẩu sai!"));
                }
            } catch (error) {
                alert("❌ Lỗi kết nối hệ thống: " + error.message);
            }
        }

        // 4. LOGIC TẢI DANH SÁCH & TÍNH TOÁN LẠI SỐ DƯ (Khắc phục lỗi hiện thị 0đ)
        async function loadTransactions() {
            if (!currentUser || !currentUser.id) return;

            try {
                // Lấy danh sách giao dịch có lọc theo mã ID người dùng đang đăng nhập
                const response = await fetch(`${API_URL}/transactions?userId=${currentUser.id}`);
                if (!response.ok) throw new Error("Không lấy được dữ liệu từ cơ sở dữ liệu.");
                
                const transactions = await response.json();
                
                const listContainer = document.getElementById('transactionList');
                listContainer.innerHTML = ''; 

                document.getElementById('totalRecords').innerText = `Tổng: ${transactions.length} bản ghi`;

                let currentBalance = 0;

                if (transactions.length === 0) {
                    listContainer.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">Chưa có giao dịch nào phát sinh.</td></tr>`;
                    document.getElementById('availableBalance').innerText = `0 đ`;
                    return;
                }

                // Vòng lặp đọc dữ liệu hiển thị ra bảng và tính toán tổng tiền tài khoản
                transactions.forEach(item => {
                    const amountNum = parseFloat(item.amount);
                    
                    // Phân loại: Dựa vào giá trị cột 'type' mới ('income' hoặc 'expense')
                    const isIncome = item.type === 'income' || amountNum > 0;
                    
                    if (isIncome) {
                        currentBalance += Math.abs(amountNum);
                    } else {
                        currentBalance -= Math.abs(amountNum);
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="py-3 px-4 fw-medium text-dark">${item.title}</td>
                        <td class="py-3 px-4">
                            <span class="badge ${isIncome ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">
                                ${isIncome ? '📈 Khoản Thu In' : '📉 Khoản Chi Out'}
                            </span>
                        </td>
                        <td class="py-3 px-4 fw-bold ${isIncome ? 'text-success' : 'text-danger'}">
                            ${isIncome ? '+' : '-'}${Math.abs(amountNum).toLocaleString('vi-VN')} đ
                        </td>
                        <td class="py-3 px-4 text-muted small">${new Date(item.createdat).toLocaleString('vi-VN')}</td>
                    `;
                    listContainer.appendChild(tr);
                });

                // Cập nhật số tiền hiển thị lên ví chính thức
                document.getElementById('availableBalance').innerText = `${currentBalance.toLocaleString('vi-VN')} đ`;

            } catch (error) {
                console.error("Lỗi trong quá trình hiển thị dữ liệu bảng:", error);
            }
        }

        // 5. LOGIC THÊM MỚI GIAO DỊCH (Truyền chuẩn userId không bao giờ lo dính NULL)
        async function handleAddTransaction(event) {
            if (event) event.preventDefault();

            if (!currentUser || !currentUser.id) {
                alert("❌ Phiên làm việc đã hết hạn, vui lòng đăng nhập lại!");
                showAuthForm();
                return;
            }

            const titleInput = document.getElementById('txTitle');
            const amountInput = document.getElementById('txAmount');
            const typeSelect = document.getElementById('txType');

            const title = titleInput.value.trim();
            let amount = parseFloat(amountInput.value.trim());
            const type = typeSelect.value;

            if (!title || isNaN(amount) || amount <= 0) {
                alert("⚠️ Số tiền phải lớn hơn 0 và tiêu đề không được rỗng!");
                return;
            }

            // Đồng bộ định dạng số tiền âm hoặc dương tùy thuộc vào cấu trúc Backend của bạn
            if (type === 'expense') {
                amount = -Math.abs(amount);
            } else {
                amount = Math.abs(amount);
            }

            // Gói tin payload: Truyền trực tiếp ID người dùng (ví dụ: 1) lên database Neon
            const payload = {
                userId: currentUser.id, 
                title: title,
                amount: amount,
                type: type 
            };

            try {
                const response = await fetch(`${API_URL}/transactions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("🎉 Thêm giao dịch mới thành công!");
                    titleInput.value = '';
                    amountInput.value = '';
                    loadTransactions(); // Cập nhật lại màn hình ngay tắp lự
                } else {
                    const errData = await response.json();
                    alert("❌ Không thể ghi nhận giao dịch: " + (errData.message || "Lỗi lưu database."));
                }
            } catch (error) {
                alert("❌ Gặp sự cố kết nối mạng: " + error.message);
            }
        }

        // Hàm Đăng xuất
        function handleLogout() {
            if (confirm("Bạn có muốn đăng xuất tài khoản an toàn không?")) {
                showAuthForm();
                window.location.reload();
            }
        }
    </script>
</body>
</html>
