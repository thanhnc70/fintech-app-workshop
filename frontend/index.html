<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví Thông Minh</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen">
    <div id="app" class="max-w-7xl mx-auto p-6">
        <!-- Login/Register Screen -->
        <div id="authScreen">
            <div class="max-w-md mx-auto mt-20">
                <div class="text-center mb-10">
                    <div class="w-16 h-16 bg-gradient-to-br from-violet-500 to-fuchsia-500 rounded-3xl mx-auto flex items-center justify-center text-4xl mb-4">
                        💰
                    </div>
                    <h1 class="text-4xl font-bold">Ví Thông Minh</h1>
                    <p class="text-zinc-400 mt-2">Quản lý tài chính cá nhân • Neon Cloud</p>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-8">
                    <button onclick="showLogin()" id="tabLogin"
                            class="py-3 font-medium rounded-2xl bg-white text-black">Đăng Nhập</button>
                    <button onclick="showRegister()" id="tabRegister"
                            class="py-3 font-medium rounded-2xl bg-zinc-800 hover:bg-zinc-700">Đăng Ký</button>
                </div>

                <!-- Login Form -->
                <div id="loginForm">
                    <div class="space-y-4">
                        <input id="loginUsername" type="text" placeholder="Tên tài khoản" 
                               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-violet-500">
                        <input id="loginPassword" type="password" placeholder="Mật khẩu" 
                               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-violet-500">
                        <button onclick="handleLogin()" 
                                class="w-full bg-white text-black font-bold py-4 rounded-2xl hover:bg-emerald-400 transition">
                            Đăng Nhập
                        </button>
                    </div>
                </div>

                <!-- Register Form -->
                <div id="registerForm" class="hidden">
                    <div class="space-y-4">
                        <input id="regFullname" type="text" placeholder="Họ và tên" 
                               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-violet-500">
                        <input id="regUsername" type="text" placeholder="Tên tài khoản" 
                               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-violet-500">
                        <input id="regPassword" type="password" placeholder="Mật khẩu" 
                               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-violet-500">
                        <button onclick="handleRegister()" 
                                class="w-full bg-white text-black font-bold py-4 rounded-2xl hover:bg-emerald-400 transition">
                            Tạo Tài Khoản
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboardScreen" class="hidden">
            <!-- Nội dung dashboard đẹp sẽ ở đây -->
            <div id="dashboardContent"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://fintech-backend-api-t83c.onrender.com/api";
        let currentUserId = null;
        let currentUserName = "";

        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
        }

        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        }

        async function handleRegister() {
            const fullname = document.getElementById('regFullname').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!fullname || !username || !password) return alert("Vui lòng điền đầy đủ thông tin");

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ fullname, username, password })
                });
                const data = await res.json();
                alert(data.message || "Đăng ký thành công! Hãy đăng nhập.");
                showLogin();
            } catch(e) {
                alert("Lỗi kết nối server");
            }
        }

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!username || !password) return alert("Vui lòng nhập tài khoản và mật khẩu");

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    currentUserId = data.userId;
                    currentUserName = data.fullname || username;

                    // Chuyển sang Dashboard
                    document.getElementById('authScreen').classList.add('hidden');
                    document.getElementById('dashboardScreen').classList.remove('hidden');
                    
                    renderDashboard();
                    fetchTransactions();
                } else {
                    alert(data.message || "Sai tài khoản hoặc mật khẩu");
                }
            } catch(e) {
                alert("Không thể kết nối server. Kiểm tra backend có đang chạy không?");
            }
        }

        function renderDashboard() {
            document.getElementById('dashboardContent').innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <!-- Phần sidebar và form -->
                    <div class="lg:col-span-4 space-y-6">
                        <div class="bg-zinc-900 rounded-3xl p-8 text-center">
                            <h2 class="text-2xl font-bold">${currentUserName}</h2>
                            <p class="text-emerald-400 mt-2">ID: #${currentUserId}</p>
                            <div class="mt-8">
                                <p class="text-zinc-400">Số dư khả dụng</p>
                                <h1 id="balanceDisplay" class="text-6xl font-bold mt-2">0 đ</h1>
                            </div>
                        </div>
                        <!-- Form thêm giao dịch -->
                        <div class="bg-zinc-900 rounded-3xl p-6">
                            <h3 class="font-semibold mb-4">+ Ghi chép mới</h3>
                            <input id="txTitle" placeholder="Nội dung giao dịch" class="w-full mb-3 bg-zinc-800 rounded-2xl px-5 py-4">
                            <div class="grid grid-cols-2 gap-3">
                                <input id="txAmount" type="number" placeholder="Số tiền" class="bg-zinc-800 rounded-2xl px-5 py-4">
                                <select id="txType" class="bg-zinc-800 rounded-2xl px-5 py-4">
                                    <option value="income">Khoản Thu</option>
                                    <option value="expense">Khoản Chi</option>
                                </select>
                            </div>
                            <button onclick="saveTransaction()" class="w-full mt-4 bg-white text-black font-bold py-4 rounded-2xl">Lưu Giao Dịch</button>
                        </div>
                    </div>
                    
                    <!-- Bảng giao dịch -->
                    <div class="lg:col-span-8">
                        <div class="bg-zinc-900 rounded-3xl p-6">
                            <h2 class="text-xl font-semibold mb-4">Sổ nhật ký thu chi</h2>
                            <table class="w-full">
                                <thead>
                                    <tr class="text-zinc-400 border-b border-zinc-700">
                                        <th class="py-4 text-left">Nội dung</th>
                                        <th class="py-4">Loại</th>
                                        <th class="py-4 text-right">Số tiền</th>
                                        <th class="py-4 text-center">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="transactionList" class="divide-y divide-zinc-800"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // Các hàm fetch, save, delete... (giữ nguyên như trước)
        async function fetchTransactions() {
            try {
                const res = await fetch(`${API_URL}/transactions?userId=${currentUserId}`);
                const data = await res.json();
                window.transactions = data.transactions || [];
                renderTransactionTable();
            } catch(e) {}
        }

        function renderTransactionTable() {
            const tbody = document.getElementById('transactionList');
            tbody.innerHTML = '';
            let balance = 0;

            window.transactions.forEach(tx => {
                const amt = parseFloat(tx.amount);
                const isIncome = tx.type === 'income';
                if (isIncome) balance += amt; else balance -= amt;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="py-4">${tx.title}</td>
                    <td><span class="px-4 py-1 rounded-full text-xs ${isIncome ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${isIncome ? 'Thu' : 'Chi'}</span></td>
                    <td class="text-right font-medium ${isIncome ? 'text-emerald-400' : 'text-rose-400'}">${isIncome ? '+' : '-'}${amt.toLocaleString()} đ</td>
                    <td class="text-center text-rose-400 cursor-pointer" onclick="deleteTransaction(${tx.id})">Xóa</td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('balanceDisplay').textContent = balance.toLocaleString() + " đ";
        }

        async function saveTransaction() {
            const title = document.getElementById('txTitle').value;
            const amount = document.getElementById('txAmount').value;
            const type = document.getElementById('txType').value;

            if (!title || !amount) return alert("Vui lòng nhập đầy đủ");

            await fetch(`${API_URL}/transactions`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: currentUserId, title, amount: parseFloat(amount), type })
            });
            alert("Lưu thành công!");
            document.getElementById('txTitle').value = '';
            document.getElementById('txAmount').value = '';
            fetchTransactions();
        }

        async function deleteTransaction(id) {
            if (confirm("Xóa giao dịch này?")) {
                await fetch(`${API_URL}/transactions/${id}`, { method: 'DELETE' });
                fetchTransactions();
            }
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
