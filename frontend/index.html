<!DOCTYPE html>

<body class="bg-slate-50 font-sans min-h-screen flex flex-col justify-between">

    <header class="text-center py-10 bg-white shadow-sm border-b border-slate-100">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 text-white text-2xl shadow-lg shadow-blue-200 mb-4">
            <i class="fa-solid fa-wallet"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-8xl">Ví Điện Tử Thông Minh</h1>
        <p class="text-slate-500 mt-2 font-medium">Quản lý tài chính cá nhân theo phong cách chuyên nghiệp</p>
    </header>

    <main class="max-w-5xl w-full mx-auto px-4 py-12 flex-grow flex items-center justify-center">
        <div class="grid md:grid-cols-2 gap-8 w-full">
            
            <div class="bg-white p-8 rounded-3xl shadow-md border border-slate-100 transition-all hover:shadow-lg">

                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg font-bold">

                    </div>
                    <h2 class="text-2xl font-bold text-slate-800">Tạo Tài Khoản</h2>
                </div>
                
                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1.5">Họ và Tên</label>
                        <input type="text" id="regFullname" placeholder="Ví dụ: Nguyễn Văn An" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all bg-slate-50/50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1.5">Tài khoản</label>
                        <input type="text" id="regUsername" placeholder="Nhập tên tài khoản" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all bg-slate-50/50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1.5">Mật khẩu</label>
                        <input type="password" id="regPassword" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all bg-slate-50/50">
                    </div>
                    <button type="button" onclick="handleRegister(event)" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-check"></i> Đăng Ký Tài Khoản
                    </button>
                </form>
            </div>

            <div class="bg-white p-8 rounded-3xl shadow-md border border-slate-100 transition-all hover:shadow-lg">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg font-bold">
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800">Đăng Nhập Máy Chủ</h2>
                </div>
                
                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1.5">Tài khoản</label>
                        <input type="text" id="loginUsername" placeholder="Nhập tài khoản" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all bg-slate-50/50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1.5">Mật khẩu</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all bg-slate-50/50">
                    </div>
                    <button type="button" onclick="handleLogin(event)" class="w-full mt-8 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-server"></i> Kết Nối Hệ Thống
                    </button>
                </form>
            </div>

        </div>
    </main>

    <footer class="text-center py-6 text-sm text-slate-400 font-medium">
        &copy; 2026 Fintech Workshop. Đồng bộ dữ liệu Full-Stack trực tuyến.

    <script>
        // ĐƯỜNG LINK API CHUẨN ĐÃ ĐƯỢC FIX LỖI CHÍNH TẢ PHÂN TÁCH SUBDOMAIN RENDER
        const API_URL = 'https://fintech-backend-api-t83c.onrender.com/api';

        // 1. XỬ LÝ ĐĂNG KÝ
        async function handleRegister(event) {
            if (event) event.preventDefault(); // Đóng băng lệnh reload trang rác của trình duyệt
            
            const fullname = document.getElementById('regFullname').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (fullname === "" || username === "" || password === "") {
                alert("⚠️ Vui lòng điền đầy đủ tất cả thông tin đăng ký!");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, fullname })
                });
                const data = await response.json();
                alert(data.message);
            } catch (error) {
                alert("❌ Lỗi kết nối đám mây: " + error.message);
            }
        }
