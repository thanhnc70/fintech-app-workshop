<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví Thông Minh</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen">
    <div class="max-w-7xl mx-auto p-6">
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-gradient-to-br from-violet-500 to-fuchsia-500 rounded-2xl flex items-center justify-center text-2xl">💰</div>
                <div>
                    <h1 class="text-3xl font-bold">Ví Thông Minh</h1>
                    <p class="text-zinc-400 text-sm">Quản lý tài chính • Neon Cloud</p>
                </div>
            </div>
            <button onclick="logout()" class="px-6 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-2xl text-sm font-medium">Đăng xuất</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Balance -->
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-zinc-900 rounded-3xl p-8">
                    <p class="text-zinc-400">Số dư khả dụng</p>
                    <h2 id="balanceDisplay" class="text-6xl font-bold mt-3">0 đ</h2>
                    <div class="grid grid-cols-2 gap-4 mt-8">
                        <div class="bg-emerald-500/10 rounded-2xl p-4">
                            <p class="text-emerald-400 text-sm">TỔNG THU</p>
                            <p id="totalIncome" class="text-2xl font-semibold text-emerald-400 mt-1">0 đ</p>
                        </div>
                        <div class="bg-rose-500/10 rounded-2xl p-4">
                            <p class="text-rose-400 text-sm">TỔNG CHI</p>
                            <p id="totalExpense" class="text-2xl font-semibold text-rose-400 mt-1">0 đ</p>
                        </div>
                    </div>
                </div>

                <!-- Add Form -->
                <div class="bg-zinc-900 rounded-3xl p-6">
                    <h3 class="font-semibold mb-4">+ Ghi chép mới</h3>
                    <div class="space-y-4">
                        <input id="txTitle" type="text" placeholder="Nội dung giao dịch" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-violet-500">
                        <div class="grid grid-cols-2 gap-4">
                            <input id="txAmount" type="number" placeholder="Số tiền" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-violet-500">
                            <select id="txType" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-violet-500">
                                <option value="income">📈 Khoản Thu</option>
                                <option value="expense">📉 Khoản Chi</option>
                            </select>
                        </div>
                        <button onclick="saveTransaction()" class="w-full bg-white text-black font-bold py-4 rounded-2xl hover:bg-emerald-400 transition">💾 LƯU GIAO DỊCH</button>
                    </div>
                </div>
            </div>

            <!-- Transactions -->
            <div class="lg:col-span-8">
                <div class="bg-zinc-900 rounded-3xl p-6">
                    <div class="flex justify-between mb-6">
                        <h2 class="text-xl font-semibold">Sổ nhật ký thu chi</h2>
                        <input id="searchInput" type="text" placeholder="Tìm kiếm..." onkeyup="filterTransactions()" 
                               class="bg-zinc-800 rounded-2xl px-4 py-2 w-80 outline-none">
                    </div>
                    <table class="w-full">
                        <thead>
                            <tr class="text-zinc-400 border-b border-zinc-700">
                                <th class="py-4 text-left">Nội dung</th>
                                <th class="py-4">Loại</th>
                                <th class="py-4 text-right">Số tiền</th>
                                <th class="py-4 text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="transactionList" class="divide-y divide-zinc-800"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://fintech-backend-api-t83c.onrender.com/api";
        let transactions = [];
        let currentUserId = 1; // tạm thời hardcode, sau sẽ lấy từ login

        async function fetchTransactions() {
            try {
                const res = await fetch(`${API_URL}/transactions?userId=${currentUserId}`);
                const data = await res.json();
                transactions = data.transactions || [];
                renderTransactions();
            } catch(e) { console.error(e); }
        }

        function renderTransactions() {
            const tbody = document.getElementById('transactionList');
            tbody.innerHTML = '';
            let balance = 0, income = 0, expense = 0;

            transactions.forEach(tx => {
                const amt = parseFloat(tx.amount);
                const isIncome = tx.type === 'income';
                if (isIncome) { income += amt; balance += amt; }
                else { expense += amt; balance -= amt; }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-4">${tx.title}</td>
                    <td><span class="px-3 py-1 rounded-full text-xs ${isIncome ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${isIncome ? 'Thu' : 'Chi'}</span></td>
                    <td class="text-right font-medium ${isIncome ? 'text-emerald-400' : 'text-rose-400'}">${isIncome ? '+' : '-'}${amt.toLocaleString()} đ</td>
                    <td class="text-center">
                        <button onclick="deleteTransaction(${tx.id})" class="text-rose-400 hover:text-rose-500">Xóa</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('balanceDisplay').textContent = balance.toLocaleString() + " đ";
            document.getElementById('totalIncome').textContent = income.toLocaleString() + " đ";
            document.getElementById('totalExpense').textContent = expense.toLocaleString() + " đ";
        }

        async function saveTransaction() {
            const title = document.getElementById('txTitle').value.trim();
            const amount = document.getElementById('txAmount').value;
            const type = document.getElementById('txType').value;

            if (!title || !amount) return alert("Vui lòng nhập đầy đủ!");

            try {
                await fetch(`${API_URL}/transactions`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId: currentUserId, title, amount: parseFloat(amount), type })
                });
                alert("✅ Lưu thành công!");
                document.getElementById('txTitle').value = '';
                document.getElementById('txAmount').value = '';
                fetchTransactions();
            } catch(e) {
                alert("❌ Lỗi kết nối server");
            }
        }

        async function deleteTransaction(id) {
            if(confirm("Xóa giao dịch này?")) {
                await fetch(`${API_URL}/transactions/${id}`, { method: 'DELETE' });
                fetchTransactions();
            }
        }

        function filterTransactions() {
            // Có thể mở rộng sau
            renderTransactions();
        }

        function logout() {
            alert("Đã đăng xuất!");
            window.location.reload();
        }

        // Khởi động
        window.onload = fetchTransactions;
    </script>
</body>
</html>
